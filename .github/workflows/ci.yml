name: Native CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ai-taskboard/T-0100]
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      CSC_INSTALLER_LINK:
        required: false
      CSC_INSTALLER_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, platform: win32, arch: x64, image: windows-2025 }
          - { os: windows, platform: win32, arch: arm64, image: windows-11-arm }
          - { os: linux, platform: linux, arch: x64, image: ubuntu-24.04 }
          - { os: linux, platform: linux, arch: arm64, image: ubuntu-24.04-arm }
          - { os: macos, platform: darwin, arch: x64, image: macos-15-intel }
          - { os: macos, platform: darwin, arch: arm64, image: macos-15 }
    defaults:
      run:
        shell: bash
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      RUNNER_IMAGE: ${{ matrix.image }}
      AI_TASKBOARD_PROJECT_URL: https://github.com/${{ github.repository }}
      AI_TASKBOARD_MAINTAINER: AI Taskboard <41898282+github-actions[bot]@users.noreply.github.com>

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          architecture: ${{ matrix.arch }}
          package-manager-cache: false

      - name: Record build identity and verify runner and Node
        env:
          HOST_ARCH: ${{ runner.arch }}
        run: |
          mkdir -p ci-results
          node --input-type=module <<'JS' | tee ci-results/build.json
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json'));
          const { TARGET_OS, TARGET_PLATFORM, TARGET_ARCH, RUNNER_IMAGE, HOST_ARCH,
            GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT, GITHUB_SHA } = process.env;
          console.log(JSON.stringify({ version, os: TARGET_OS, targetArch: TARGET_ARCH,
            image: RUNNER_IMAGE, hostArch: HOST_ARCH, node: process.version,
            nodePlatform: process.platform, nodeArch: process.arch, sha: GITHUB_SHA,
            run: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}` }, null, 2));
          assert.equal(HOST_ARCH.toLowerCase(), TARGET_ARCH);
          assert.equal(process.platform, TARGET_PLATFORM);
          assert.equal(process.arch, TARGET_ARCH);
          JS
          version=$(node -p "require('./package.json').version")
          echo "PACKAGE_ID=ai-taskboard-${version}-${TARGET_OS}-${TARGET_ARCH}" >> "$GITHUB_ENV"

      - name: Install Linux runtime and native package tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libopenjp2-tools rpm libarchive-tools

      - name: Install dependencies
        run: npm ci 2>&1 | tee ci-results/npm-ci.log
      - name: Check types and documentation
        run: |
          npm run check 2>&1 | tee ci-results/types.log
          npm run check:docs 2>&1 | tee ci-results/docs.log
      - name: Run CLI, desktop and release tests
        run: |
          node --test tests/board-creation.test.ts tests/board-location.test.ts tests/localization-settings.test.ts tests/documentation.test.ts tests/release.test.mjs tests/updates.test.ts 2>&1 | tee ci-results/tests.log
      - name: Build standalone CLI and Electron package
        if: '!inputs.signed'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --ci 2>&1 | tee ci-results/package.log
      - name: Build and sign Windows installer
        if: inputs.signed && matrix.os == 'windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package -- --release 2>&1 | tee ci-results/package.log
      - name: Build, sign and notarize macOS installer
        if: inputs.signed && matrix.os == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package -- --release 2>&1 | tee ci-results/package.log
      - name: Build Linux release packages
        if: inputs.signed && matrix.os == 'linux'
        run: npm run package -- --release 2>&1 | tee ci-results/package.log
      - name: Verify packaged CLI and launch the packaged desktop
        env:
          RELEASE_ARG: ${{ inputs.signed && '--release' || '' }}
        run: |
          args=("$TARGET_ARCH" ci-results)
          if [[ -n "$RELEASE_ARG" ]]; then args+=("$RELEASE_ARG"); fi
          if [[ "$TARGET_OS" == linux ]]; then
            # Ubuntu 24.04 restricts unprivileged user namespaces. Use Electron's setuid sandbox.
            sandbox=(release/linux*-unpacked/chrome-sandbox)
            sudo chown root:root "${sandbox[@]}"
            sudo chmod 4755 "${sandbox[@]}"
            xvfb-run -a node scripts/check-ci-package.mjs "${args[@]}" 2>&1 | tee ci-results/smoke.log
          else
            node scripts/check-ci-package.mjs "${args[@]}" 2>&1 | tee ci-results/smoke.log
          fi

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ID }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            release/${{ env.PACKAGE_ID }}.exe
            release/${{ env.PACKAGE_ID }}.deb
            release/${{ env.PACKAGE_ID }}.rpm
            release/${{ env.PACKAGE_ID }}.zip
            release/${{ env.PACKAGE_ID }}.pkg
      - name: Upload verification and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
          path: |
            ci-results/
            release/builder-debug.yml
            release/builder-effective-config.yaml

  windows-install:
    name: Windows installer / ${{ matrix.arch }}
    if: github.workflow == 'Native CI'
    needs: package
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, image: windows-2025 }
          - { arch: arm64, image: windows-11-arm }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-taskboard-*-windows-*
          path: installers
          merge-multiple: true
      - name: Verify installation and architecture rejection
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $installer = @(Get-ChildItem installers -Filter "*-windows-$env:TARGET_ARCH.exe")
          if ($installer.Count -ne 1) {
            throw "Expected one $env:TARGET_ARCH installer, found $($installer.Count)."
          }
          $params = @{
            Architecture = $env:TARGET_ARCH
            Installer = $installer[0].FullName
            ReportDir = 'installer-results'
          }
          if ($env:TARGET_ARCH -eq 'x64') {
            $arm = @(Get-ChildItem installers -Filter '*-windows-arm64.exe')
            if ($arm.Count -ne 1) {
              throw "Expected one ARM64 installer, found $($arm.Count)."
            }
            $params.IncompatibleInstaller = $arm[0].FullName
          }
          ./scripts/check-windows-installer.ps1 @params
      - name: Upload installer verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-windows-installer-${{ matrix.arch }}
          path: installer-results/
