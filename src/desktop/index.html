<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' taskboard-assets:; style-src 'self'; font-src 'self'; img-src blob: data: https: http:">
  <title>AI Taskboard</title>
  <script src="../../node_modules/prismjs/prism.js" defer data-manual></script>
  <script src="./review-diff.js" defer></script>
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./vendor/codicons/codicon.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="taskboard-assets://vendor/markdown-it.js" defer></script>
  <script src="./image-preview.js" defer></script>
  <script src="./keyboard-focus.js" defer></script>
  <script src="./source-files.cjs" defer></script>
  <script src="./markdown.js" defer></script>
  <script src="./chat.js" defer></script>
  <script src="./provider-limits.js" defer></script>
  <script src="./renderer.js" defer></script>
</head>
<body>
  <header id="app-header" class="app-menu-bar" hidden>
    <div class="app-menu-start">
      <i class="icon codicon codicon-layout" aria-hidden="true"></i>
      <nav id="app-menu" class="app-menu" role="menubar" hidden></nav>
    </div>
  </header>
  <nav id="project-tabs" class="project-tabs" role="tablist" aria-label="Projects" aria-orientation="vertical" hidden></nav>
  <button id="app-settings" class="button quiet app-settings" type="button" aria-label="Application settings" title="Application settings">
    <i class="icon codicon codicon-settings-gear" aria-hidden="true"></i>
  </button>
  <div id="board-tab-menu" class="app-menu-popup board-tab-menu" role="menu" popover></div>
  <div id="settings-menu" class="app-menu-popup settings-menu" role="menu" popover></div>
  <main id="app-content">
    <div id="notice" class="notice" hidden>
      <div class="notice-content" role="status"><strong id="notice-context"></strong><span id="notice-message"></span></div>
      <button type="button" id="notice-close" class="button quiet" aria-label="Dismiss notification" title="Dismiss notification">
        <i class="icon codicon codicon-close" aria-hidden="true"></i>
      </button>
    </div>
    <section id="welcome" class="welcome" hidden>
      <div class="welcome-content">
        <h1>AI Taskboard</h1>
        <section class="welcome-section" aria-labelledby="welcome-start">
          <h2 id="welcome-start">Start</h2>
          <button id="welcome-create" class="welcome-link" type="button"><i class="icon codicon codicon-add" aria-hidden="true"></i><span>Create board</span></button>
          <button id="welcome-open" class="welcome-link" type="button"><i class="icon codicon codicon-folder" aria-hidden="true"></i><span>Open existing board</span></button>
        </section>
        <section class="welcome-section" aria-labelledby="welcome-recent">
          <h2 id="welcome-recent">Recent boards</h2>
          <ul id="recent-boards" class="recent-boards"></ul>
          <p id="recent-empty" class="muted" hidden>No recent boards yet.</p>
        </section>
      </div>
    </section>
    <section id="workspace" class="workspace" hidden>
      <div id="lanes" class="lanes"></div>
      <div id="archive-list" class="archive-list" hidden></div>
      <div id="board-composer" class="board-composer"></div>
    </section>
  </main>
  <footer class="status-bar">
    <div class="status-repository">
      <button id="status-branch" type="button" class="button quiet status-git" popovertarget="git-branches" hidden><i class="icon codicon codicon-git-branch" aria-hidden="true"></i><span></span></button>
      <button id="status-tracking" type="button" class="button quiet status-tracking" hidden><i class="icon codicon codicon-sync" aria-hidden="true"></i><span></span></button>
      <button id="status-publish" type="button" class="button quiet" aria-label="Publish to GitHub" hidden><i class="icon codicon codicon-cloud-upload" aria-hidden="true"></i></button>
    </div>
    <button id="status-auto-mode" type="button" class="button quiet" aria-pressed="false" hidden><i class="icon codicon codicon-play" aria-hidden="true"></i><span></span></button>
    <section id="git-branches" class="git-branches" popover aria-label="Branches and tags"></section>
    <button id="status-limits" type="button" class="button quiet" popovertarget="provider-limits"><i class="icon codicon codicon-target" aria-hidden="true"></i><span>Limits</span></button>
    <section id="provider-limits" popover aria-label="Provider limits"></section>
    <div class="status-activity">
      <span id="status-agents" role="img" tabindex="0" aria-describedby="status-agents-tooltip" hidden><i class="icon codicon codicon-hubot" aria-hidden="true"></i><span aria-hidden="true"></span><span id="status-agents-tooltip" role="tooltip"></span></span>
      <button id="status-notifications" type="button" class="button quiet" popovertarget="notifications" aria-label="Review queue">
        <i class="icon codicon codicon-bell" aria-hidden="true"></i><span class="count" aria-hidden="true" hidden></span>
      </button>
    </div>
    <section id="notifications" class="notifications" popover aria-label="Review queue"></section>
  </footer>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title" closedby="closerequest">
    <div class="sheet-header">
      <h2 id="sheet-title"></h2>
      <button id="close-sheet" class="button quiet" aria-label="Close"><i class="icon codicon codicon-close" aria-hidden="true"></i></button>
    </div>
    <div id="sheet-notice" class="notice" role="status" hidden></div>
    <div id="sheet-body" class="sheet-body" tabindex="0"></div>
  </dialog>
</body>
</html>
