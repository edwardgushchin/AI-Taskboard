<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' taskboard-assets:; style-src 'self'; img-src blob: data: https: http:">
  <title>AI Taskboard</title>
  <script src="../../node_modules/prismjs/prism.js" defer data-manual></script>
  <script src="./review-diff.js" defer></script>
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="taskboard-assets://vendor/markdown-it.js" defer></script>
  <script src="./image-preview.js" defer></script>
  <script src="./chat.js" defer></script>
  <script src="./renderer.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-board" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10m4-10v10"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 16 16"><path d="M2 5V4a1 1 0 0 1 1-1h3l1.5 2H13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3 3"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 16 16"><path d="M2.5 3.5h11l-4 4.75v3.25l-3 1.5V8.25Z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 16 16"><path d="M8 3.5v9m-4.5-4.5h9"/></symbol>
    <symbol id="icon-checklist" viewBox="0 0 16 16"><path d="m2 5 1.25 1.25L5.5 4M7.5 5H14M2 10h3v3H2zm5.5 1.5H14"/></symbol>
    <symbol id="icon-attachment" viewBox="0 0 16 16"><path d="m9.75 5-4 4a1.4 1.4 0 0 0 2 2l4.6-4.6a2.65 2.65 0 0 0-3.75-3.75L3.75 7.5a3.9 3.9 0 0 0 5.5 5.5l3-3"/></symbol>
    <symbol id="icon-microphone" viewBox="0 0 16 16"><rect x="6" y="2" width="4" height="7" rx="2"/><path d="M4 7a4 4 0 0 0 8 0M8 11v3m-2 0h4"/></symbol>
  </svg>
  <header id="app-header" class="app-menu-bar" hidden>
    <div class="app-menu-start">
      <svg class="icon" aria-hidden="true"><use href="#icon-board"/></svg>
      <nav id="app-menu" class="app-menu" role="menubar" hidden></nav>
    </div>
    <div id="board-actions" class="board-actions" hidden>
      <label class="search-box">
        <input id="search" type="search" aria-label="Search tasks" placeholder=" ">
        <span class="search-hint" aria-hidden="true">
          <svg class="icon"><use href="#icon-search"/></svg>
          <span id="search-hint">Search tasks…</span>
        </span>
      </label>
      <div class="task-actions">
        <details id="filters" class="filters">
          <summary id="filter-toggle" class="button icon-button" aria-label="Filters" title="Filters"><svg class="icon" aria-hidden="true"><use href="#icon-filter"/></svg><span id="filter-count" class="count" aria-hidden="true" hidden></span></summary>
          <div class="filter-panel">
            <label><span id="priority-filter-label">Priority</span><select id="priority-filter"></select></label>
            <fieldset class="tag-filters"><legend id="tag-filter-label">Tags</legend><div id="tag-filter"></div></fieldset>
          </div>
        </details>
        <button id="create" class="button primary" type="button"><span>New task</span></button>
      </div>
    </div>
  </header>
  <main id="app-content">
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="welcome" class="welcome">
      <div class="welcome-content">
        <h1>AI Taskboard</h1>
        <section class="welcome-section" aria-labelledby="welcome-start">
          <h2 id="welcome-start">Start</h2>
          <button id="welcome-create" class="welcome-link" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg><span>Create board</span></button>
          <button id="welcome-open" class="welcome-link" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg><span>Open existing board</span></button>
        </section>
        <section class="welcome-section" aria-labelledby="welcome-recent">
          <h2 id="welcome-recent">Recent boards</h2>
          <ul id="recent-boards" class="recent-boards"></ul>
          <p id="recent-empty" class="muted" hidden>No recent boards yet.</p>
        </section>
      </div>
    </section>
    <section id="workspace" class="workspace" hidden>
      <div id="lanes" class="lanes"></div>
      <div id="archive-list" class="archive-list" hidden></div>
    </section>
  </main>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title" closedby="closerequest">
    <div class="sheet-header">
      <h2 id="sheet-title"></h2>
      <button id="close-sheet" class="button quiet" aria-label="Close">×</button>
    </div>
    <div id="sheet-notice" class="notice" role="status" hidden></div>
    <div id="sheet-body" class="sheet-body" tabindex="0"></div>
  </dialog>
</body>
</html>
