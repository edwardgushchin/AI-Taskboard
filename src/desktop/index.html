<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>AI Taskboard</title>
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./renderer.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-board" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10m4-10v10"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 16 16"><path d="M2 5V4a1 1 0 0 1 1-1h3l1.5 2H13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3 3"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 16 16"><path d="M2.5 3.5h11l-4 4.75v3.25l-3 1.5V8.25Z"/></symbol>
    <symbol id="icon-archive" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="3.5" rx="1"/><path d="M3 6v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 8.5h3"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 16 16"><path d="M13 7a5 5 0 1 0-.75 4M13 3.5V7H9.5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 16 16"><path d="m6.5 2-.45 1.6-1.3.75-1.6-.4-1.4 2.4 1.15 1.15v1.5L1.75 10l1.4 2.4 1.6-.4 1.3.75.45 1.25h3l.45-1.25 1.3-.75 1.6.4 1.4-2.4L13.1 9V7.5l1.15-1.15-1.4-2.4-1.6.4-1.3-.75L9.5 2Z"/><circle cx="8" cy="8" r="2"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 16 16"><path d="M8 3.5v9m-4.5-4.5h9"/></symbol>
    <symbol id="icon-checklist" viewBox="0 0 16 16"><path d="m2 5 1.25 1.25L5.5 4M7.5 5H14M2 10h3v3H2zm5.5 1.5H14"/></symbol>
    <symbol id="icon-attachment" viewBox="0 0 16 16"><path d="m9.75 5-4 4a1.4 1.4 0 0 0 2 2l4.6-4.6a2.65 2.65 0 0 0-3.75-3.75L3.75 7.5a3.9 3.9 0 0 0 5.5 5.5l3-3"/></symbol>
  </svg>
  <header id="app-header" class="topbar">
    <div class="brand"><svg class="icon" aria-hidden="true"><use href="#icon-board"/></svg>AI Taskboard</div>
    <button id="open-project" class="button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg><span>Open project</span></button>
    <button id="settings" class="button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg><span>Settings</span></button>
  </header>
  <main>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="welcome" class="welcome">
      <div class="welcome-card">
        <span class="kicker">AI TASKBOARD</span>
        <h1 id="welcome-title">Open a project</h1>
        <p id="welcome-note">Choose a project folder to open its task board.</p>
        <button id="welcome-action" class="button primary">Open folder</button>
      </div>
    </section>
    <section id="workspace" class="workspace" hidden>
      <header class="board-heading">
        <div class="breadcrumb">
          <button id="board-project" class="button project-button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-board"/></svg><span></span></button>
          <span aria-hidden="true">/</span><h1 id="board-title">Task board</h1>
        </div>
        <div class="board-actions">
          <label class="search-box">
            <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
            <input id="search" type="search" aria-label="Search tasks" placeholder="Search tasks…">
          </label>
          <details id="filters" class="filters">
            <summary class="button"><svg class="icon" aria-hidden="true"><use href="#icon-filter"/></svg><span id="filter-label">Filters</span><span id="filter-count" class="count" hidden></span></summary>
            <div class="filter-panel">
              <label><span id="priority-filter-label">Priority</span><select id="priority-filter"></select></label>
              <label><span id="tag-filter-label">Tag</span><select id="tag-filter"></select></label>
            </div>
          </details>
          <button id="archive-toggle" class="button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-archive"/></svg><span>Archive</span></button>
          <button id="board-settings" class="button icon-button" type="button" aria-label="Settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg></button>
          <button id="refresh" class="button icon-button" type="button" aria-label="Refresh board" title="Refresh board"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg></button>
          <button id="create" class="button primary" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg><span>New task</span></button>
        </div>
      </header>
      <div id="lanes" class="lanes"></div>
      <div id="archive-list" class="archive-list" hidden></div>
    </section>
  </main>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-header">
      <h2 id="sheet-title"></h2>
      <button id="close-sheet" class="button quiet" aria-label="Close">×</button>
    </div>
    <div id="sheet-notice" class="notice" role="status" hidden></div>
    <div id="sheet-body" class="sheet-body" tabindex="0"></div>
  </dialog>
</body>
</html>
